<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>英単語テスト（Web版｜学習履歴エクスポート対応）</title>
  <style>
    :root{
      --bg:#f4f8fc;
      --bg-soft:#edf5fb;
      --card:#ffffff;
      --text:#24324a;
      --title:#123b67;
      --muted:#5f6f89;
      --accent:#339af0;
      --accent-2:#63e6be;
      --accent-3:#ffd43b;
      --border:#cfdfee;
      --border-strong:#b8cfe4;
      --shadow:0 4px 14px rgba(60,110,160,.08);
      --shadow-soft:0 2px 8px rgba(60,110,160,.05);
      --ok-bg:#eafaf3;
      --ok-border:#98dcc2;
      --ok-text:#166a52;
      --ng-bg:#fff3f3;
      --ng-border:#f3b1b1;
      --ng-text:#c92a2a;
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; }

    body{
      margin:0;
      background:
        linear-gradient(90deg, rgba(255,248,204,.45) 0%, rgba(255,248,204,0) 16%),
        linear-gradient(270deg, rgba(227,250,252,.55) 0%, rgba(227,250,252,0) 18%),
        linear-gradient(180deg, #f7fbff 0%, #eef5fb 100%);
      color:var(--text);
      font-family:system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif;
    }

    .container{
      max-width:980px;
      margin:0 auto;
      padding:18px 16px 28px;
    }

    header{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
      padding:16px 16px 14px;
      margin:0 0 18px;
      background:rgba(255,255,255,.96);
      border:1px solid var(--border);
      border-radius:20px;
      box-shadow:var(--shadow-soft);
    }

    header h1{
      font-size:22px;
      margin:0 12px 0 0;
      letter-spacing:.01em;
      color:var(--title);
      font-weight:800;
    }

    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:20px;
      padding:20px;
      box-shadow:var(--shadow);
    }

    .row{
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
    }

    .grow{ flex:1 1 auto; }

    .kb-hint{
      color:var(--muted);
      font-size:12px;
      margin-left:8px;
      white-space:nowrap;
    }

    @media (max-width: 720px){
      .kb-hint{
        flex-basis:100%;
        margin:6px 0 0 0;
      }
    }

    input[type="file"]::file-selector-button{
      border:none;
      padding:11px 16px;
      border-radius:14px;
      background:linear-gradient(135deg, var(--accent), #74c0fc);
      color:#fff;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 4px 10px rgba(77,171,247,.18);
    }

    select,
    input[type="number"],
    input[type="text"],
    input[type="range"],
    button{
      background:#f8fbff;
      border:1px solid #c9dced;
      color:var(--text);
      border-radius:12px;
      padding:9px 12px;
      font-size:14px;
      box-shadow:none;
    }

    button{
      cursor:pointer;
      transition:transform .1s ease, border-color .1s ease, box-shadow .1s ease, background .1s ease;
    }

    button:hover{
      transform:translateY(-1px);
      border-color:var(--border-strong);
      background:#f1f7fe;
    }

    button:active{
      transform:translateY(0) scale(.985);
    }

    button.primary{
      background:linear-gradient(135deg, #339af0, #5cb8ff);
      border:1px solid #2f8fe0;
      color:#fff;
      font-weight:700;
      box-shadow:0 4px 10px rgba(51,154,240,.22);
    }

    button.ghost{
      background:#f2f8ff;
      border:1px dashed #aecdeb;
      color:#22577a;
    }

    button[disabled]{
      opacity:1;
      cursor:not-allowed;
      transform:none;
      box-shadow:none;
      background:#f4f7fb;
      border-color:#d9e5f0;
      color:#a5b4c4;
    }

    .replay{
      border:1px solid #58d3ae;
      background:linear-gradient(135deg, #63e6be, #38d9a9);
      color:#fff;
      box-shadow:0 4px 10px rgba(56,217,169,.22);
    }

    .replayMain,
    .bigBtn{
      padding:15px 20px;
      font-size:18px;
      border-radius:14px;
    }

    .band{
      height:8px;
      border-radius:999px;
      margin:10px 0 14px;
      background:linear-gradient(90deg, #69b8fb 0%, #8ce0c3 52%, #f1d46a 100%);
      opacity:1;
    }

    .choices{
      display:grid;
      grid-template-columns:repeat(1, minmax(0,1fr));
      gap:10px;
      margin-top:12px;
    }

    @media (min-width:720px){
      .choices{
        grid-template-columns:repeat(3, minmax(0,1fr));
      }
    }

    .choiceBtn{
      font-size:18px;
      padding:14px 16px;
      border-radius:14px;
      border:1px solid var(--border);
      background:#fff;
      color:var(--text);
      text-align:center;
      cursor:pointer;
      box-shadow:none;
    }

    .choiceBtn:hover{
      border-color:#9fcdf3;
      background:#f8fbff;
      box-shadow:0 4px 10px rgba(77,171,247,.08);
    }

    .feedback{
      margin-top:16px;
      padding:14px;
      border-radius:14px;
      font-size:18px;
      font-weight:700;
      display:none;
    }

    .feedback.ok{
      background:var(--ok-bg);
      border:1px solid var(--ok-border);
      color:var(--ok-text);
    }

    .feedback.ng{
      background:var(--ng-bg);
      border:1px solid var(--ng-border);
      color:var(--ng-text);
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-top:12px;
    }

    .stat{
      color:var(--muted);
      font-size:14px;
      background:#f7fbff;
      border:1px solid var(--border);
      padding:8px 12px;
      border-radius:12px;
    }

    .hidden{ display:none !important; }

    /* 単語リスト */
    #wordList{
      margin-top:22px;
      background:var(--card);
      padding:16px 16px 10px;
      border-radius:20px;
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      max-height:340px;
      overflow-y:auto;
    }

    #wordList table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
    }

    #wordList th,
    #wordList td{
      padding:10px 12px;
      border-bottom:1px solid #dbe7f3;
      text-align:left;
    }

    #wordList th{
      color:#184a78;
      font-weight:800;
      position:sticky;
      top:0;
      background:#f8fbff;
      z-index:1;
    }

    #wordList tr:hover td{
      background:#fbfdff;
    }

    #wordList tr:last-child td{
      border-bottom:none;
    }

    footer{
      color:var(--muted);
      font-size:12px;
      margin-top:22px;
      text-align:center;
      opacity:.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>英単語テスト（Web版）</h1>
      <div class="toolbar">
        <label class="row">CSV差し替え:
          <input id="csvInput" type="file" accept=".csv" />
        </label>
        <label class="row">TTS音声:
          <select id="voiceSelect"></select>
        </label>
        <label class="row">速度:
          <input id="rate" type="range" min="0.6" max="1.4" value="1" step="0.05" />
        </label>
        <label class="row" style="gap:6px;">
          出題数:
          <input id="questionCount" type="number" min="10" step="1" value="10" style="width:84px;" disabled>
        </label>
        <button id="startBtn" class="primary">テスト開始</button>

        <label class="row" style="gap:6px;">
          モード:
          <select id="modeSelect" disabled>
            <option value="choice">3択</option>
            <option value="spelling">スペル入力</option>
          </select>
        </label>

        <span id="kbHint" class="kb-hint">
          ⌨︎ Space/R:再生 ｜ S:選択肢表示 ｜ 1/2/3:回答 ｜ D:わからない ｜ Enter/→:次へ
        </span>
        <button id="showListBtn">単語リスト表示</button>
        <label id="sortWrap" class="row" style="display:none; gap:6px;">
          並べ替え:
          <select id="sortSelect" disabled>
            <option value="word">英単語順</option>
            <option value="accuracyDesc">正答率（高い順）</option>
            <option value="accuracyAsc">正答率（低い順）</option>
            <option value="attemptsDesc">出題回数（多い順）</option>
            <option value="attemptsAsc">出題回数（少ない順）</option>
          </select>
        </label>

        <label id="quizScopeWrap" class="row" style="display:none; gap:6px; flex-wrap:wrap;">
          出題対象:
          <select id="quizScope" disabled>
            <option value="all">全部</option>
            <option value="selected">選択のみ</option>
          </select>
          <button id="clearSelectionBtn" class="ghost" disabled>選択解除</button>
          <span id="selCount" style="color:#9bb3d9;font-size:12px;">選択:0</span>

          <!-- ▼ ここで改行して弱点選択を“下の行”に並べる -->
          <div style="flex-basis:100%; height:0;"></div>

          弱点選択: 正答率
          <input id="weakAcc" type="number" value="100" min="0" max="100" step="1" style="width:60px;"> %
          未満 かつ 出題回数
          <input id="weakMinAtt" type="number" value="1" min="1" step="1" style="width:60px;"> 回以上
          <button id="weakSelectBtn" class="ghost">一括選択</button>
        </label>

        <button id="exportBtn" class="ghost">CSVにエクスポート</button>
        <button id="resetDataBtn" class="small-btn">学習履歴リセット</button>

      </div>
    </header>

    <div class="card" id="quizCard">
      <div class="row">
        <button id="replayBtn" class="replay replayMain" title="もう一度再生">▶ 音声を再生</button>
        <div class="grow">
          <div id="qWord" style="display:none;"></div>
          <div id="qMeaning" style="display:none;"></div>
        </div>
      </div>
      <div class="band"></div>

      <div class="row">
        <button id="showChoicesBtn" class="ghost bigBtn">選択肢を表示</button>
      </div>

      <div id="spellingWrap" class="row hidden" style="gap:10px;">
        <input id="spellInput" type="text" inputmode="latin" autocomplete="off" autocapitalize="none"
            placeholder="スペルを入力" style="font-size:18px;padding:12px 14px;border-radius:12px;border:1px solid #cfdfee;background:#fff;color:#24324a;min-width:260px;box-shadow:none;">
        <button id="submitSpellBtn" class="primary bigBtn">回答</button>
      </div>

      <div id="choicesWrap" class="choices hidden"></div>

      <div id="feedback" class="feedback"></div>

      <div class="controls">
        <button id="dontKnowBtn" class="bigBtn">わからない</button>
        <button id="nextBtn" class="primary bigBtn" disabled>次へ</button>
        <div class="grow"></div>
        <div class="stat" id="progress">0 / 0</div>
        <div class="stat" id="score">正解: 0 / 不正解: 0</div>
      </div>
    </div>

    <div id="wordList" class="hidden"></div>

    <footer>
    CSVヘッダは固定です：<code>word,meaning,wrong_choices,audioUrl</code><br>
    ※ wrong_choices は <code>;</code> 区切り（例：バナナ;ぶどう;いちご;オレンジ;メロン）
    </footer>

  </div>

  <audio id="audio" preload="auto"></audio>
  
  <script>
    /* ====== 状態 ====== */
    var data = [];              // CSVからの設問データ
    var order = [];             // 出題順インデックス
    var cursor = 0;             // 次に出す位置
    var answeredCount = 0;      // 解答済み数（表示はこれを使う）
    var correct = 0, wrong = 0; // 正解・不正解
    var voices = [];            // TTS voices
    var started = false; // ★ テスト未開始＝false、開始後＝true
    var useSelectedOnly = false;       // 「選択のみ」出題フラグ
    var selectedUids = new Set();      // チェックされた行の uid 集合
    var nextUid = 1;                   // CSV取り込みごとに付与する一意ID
    var runTotal = 0; // 直近のテストの出題総数（終了後も保持）

    /* ====== 要素 ====== */
    var CSV_FILE = './eiken3_words_forWebApp.csv';
    var csvInput = document.getElementById('csvInput');
    var loadStatus = document.createElement('span');
    loadStatus.style.cssText = 'margin-left:6px;color:#9bb3d9;font-size:12px;';
    csvInput.insertAdjacentElement('afterend', loadStatus);
    var voiceSelect = document.getElementById('voiceSelect'); 
    var rateInput = document.getElementById('rate'); 
    var startBtn = document.getElementById('startBtn');
    var qWord = document.getElementById('qWord'); 
    var qMeaning = document.getElementById('qMeaning');
    var choicesWrap = document.getElementById('choicesWrap'); 
    var showChoicesBtn = document.getElementById('showChoicesBtn'); 
    var replayBtn = document.getElementById('replayBtn');
    var feedback = document.getElementById('feedback'); 
    var nextBtn = document.getElementById('nextBtn'); 
    var dontKnowBtn = document.getElementById('dontKnowBtn');
    var progress = document.getElementById('progress'); 
    var score = document.getElementById('score'); 
    var audioEl = document.getElementById('audio');
    var showListBtn = document.getElementById('showListBtn'); 
    var wordList = document.getElementById('wordList'); 
    var exportBtn = document.getElementById('exportBtn');
    var sortWrap = document.getElementById('sortWrap');
    var weakWrap = document.getElementById('weakWrap');
    var weakAcc = document.getElementById('weakAcc');
    var weakMinAtt = document.getElementById('weakMinAtt');
    var weakSelectBtn = document.getElementById('weakSelectBtn');
    var quizScopeWrap = document.getElementById('quizScopeWrap');
    var quizScope = document.getElementById('quizScope');
    var clearSelectionBtn = document.getElementById('clearSelectionBtn');
    var selCount = document.getElementById('selCount');
    var sortSelect = document.getElementById('sortSelect');
    var questionCount = document.getElementById('questionCount');
    var modeSelect = document.getElementById('modeSelect');
    var spellingWrap = document.getElementById('spellingWrap');
    var spellInput = document.getElementById('spellInput');
    var submitSpellBtn = document.getElementById('submitSpellBtn');

    /* ====== CSV読み込み ====== */
    function applyCsvText(text, sourceLabel){
      data = parseCSV(text);
      if (!data.length){
        loadStatus.textContent = sourceLabel ? (' ' + sourceLabel + ' 読み込み0件') : ' 読み込み0件';
        alert('CSVが読み取れませんでした');
        return false;
      }

      // ★ 各行に一意な uid を付与し、選択状態を初期化
      selectedUids.clear();
      nextUid = 1;
      for (var i=0; i<data.length; i++){
        data[i].uid = nextUid++;
      }

      // ---- ローカル保存の進捗をマージ（CSVの attempts/corrects と統合）----
      (function(){
        var map = loadJSON(LS_PROGRESS_KEY, {});
        for (var i=0; i<data.length; i++){
          var it = data[i];
          var rec = map[String(it.word || '').toLowerCase()];
          if (rec){
            it.attempts = Math.max(it.attempts|0, rec.attempts|0);
            it.corrects = Math.max(it.corrects|0, rec.corrects|0);
          }
        }
      })();

      // ---- UI状態の復元 ----
      (function(){
        var ui = loadJSON(LS_UI_KEY, null);
        if (!ui) return;

        // 選択語（単語名ベース）を uid に復元
        if (Array.isArray(ui.selectedWords)){
          for (var i=0; i<data.length; i++){
            if (ui.selectedWords.indexOf(String(data[i].word || '')) >= 0){
              selectedUids.add(data[i].uid);
            }
          }
        }

        // 出題対象
        if (typeof ui.useSelectedOnly === 'boolean'){
          useSelectedOnly = ui.useSelectedOnly;
          if (quizScope) quizScope.value = useSelectedOnly ? 'selected' : 'all';
        }

        // 並べ替え
        if (ui.sortValue && sortSelect){
          sortSelect.value = ui.sortValue;
        }

        // 出題数
        if (ui.questionCount && questionCount){
          questionCount.value = ui.questionCount;
        }
      })();

      prepareOrder();
      updateHud();
      renderList();

      loadStatus.textContent = (sourceLabel ? (' ' + sourceLabel) : '') + ' 読み込み' + data.length + '件';

      setControlsIdle(); // ★ テスト開始を押すまで操作不可
      runTotal = 0;
      updateHud(); // ★ 別CSVに変わったのでリセット
      questionCount.disabled = false;  // ★ 出題数の入力を有効化
      if (modeSelect) modeSelect.disabled = false; // ★ モード選択を有効化

      return true;
    }

    function loadCsvFromFile(file){
      if (!file){
        loadStatus.textContent = '';
        return;
      }

      file.text().then(function(text){
        applyCsvText(text, '手動CSV');
      }).catch(function(err){
        console.error(err);
        alert('CSV読み込みエラー');
        loadStatus.textContent = ' 手動CSVの読み込み失敗';
      });
    }

    function loadDefaultCsv(){
      loadStatus.textContent = ' CSV自動読込中...';

      fetch(CSV_FILE, { cache: 'no-store' })
        .then(function(res){
          if (!res.ok){
            throw new Error('HTTP ' + res.status);
          }
          return res.text();
        })
        .then(function(text){
          applyCsvText(text, '自動CSV');
        })
        .catch(function(err){
          console.error(err);
          loadStatus.textContent = ' 自動読込失敗（必要なら手動でCSVを選択）';
        });
    }

    csvInput.addEventListener('change', function(e){
      try {
        var file = e.target.files && e.target.files[0];
        loadCsvFromFile(file);
      } catch(err){
        console.error(err);
        alert('CSV解析エラー');
      }
    });

    window.addEventListener('DOMContentLoaded', function(){
      loadDefaultCsv();
    });

    function parseCSV(text){
      // BOM/改行正規化
      if (text && text.charCodeAt(0)===0xFEFF) text = text.slice(1);
      text = text.split('\r\n').join('\n').split('\r').join('\n');

      // シンプルCSVパーサ（ダブルクォート対応）
      var rows = [], i=0, field='', row=[], inQ=false;
      function pushF(){ row.push(field); field=''; }
      function pushR(){ if (row.length) rows.push(row); row=[]; }

      while(i<text.length){
        var c = text[i];
        if (inQ){
          if (c === '"'){
            if (text[i+1] === '"'){ field+='"'; i++; }
            else { inQ = false; }
          } else { field += c; }
        } else {
          if (c === '"'){ inQ = true; }
          else if (c === ','){ pushF(); }
          else if (c === '\n'){ pushF(); pushR(); }
          else { field += c; }
        }
        i++;
      }
      if (field.length || row.length){ pushF(); pushR(); }

      if (!rows.length) return [];

      // ヘッダ検証（完全一致で統一）
      var header = rows[0].map(function(s){ return String(s||'').trim(); });
      var expected = ['word','meaning','wrong_choices','audioUrl'];
      var ok = header.length >= 4
            && header[0] === expected[0]
            && header[1] === expected[1]
            && header[2] === expected[2]
            && header[3] === expected[3];
      if (!ok){
        alert('CSVヘッダが想定と異なります。\n期待: ' + expected.join(','));
        return [];
      }

      // データ行の読み込み（4列のみを採用）
      var out = [];
      for (var r=1; r<rows.length; r++){
        var cols = rows[r] || [];
        // 足りない列は空文字で補完
        while (cols.length < 4) cols.push('');
        var word = String(cols[0] || '').trim();
        if (!word) continue; // 単語が空なら無視

        var meaning = String(cols[1] || '').trim();
        var wraw    = String(cols[2] || '').trim();
        var aurl    = String(cols[3] || '').trim();

        var item = { word: word, meaning: meaning || '' };

        if (wraw){
          var arr = [];
          var parts = wraw.split(';');
          for (var k=0; k<parts.length; k++){
            var t = String(parts[k]||'').trim();
            if (t) arr.push(t);
          }
          if (arr.length) item.wrongChoices = arr;
        }

        if (aurl) item.audioUrl = aurl;

        // attempts/corrects はインポートしない（学習履歴はlocalStorageからマージ）
        item.attempts = 0;
        item.corrects = 0;

        out.push(item);
      }
      return out;
    }

    /* ====== 出題順 ====== */
    function prepareOrder(desiredCount){
      // 出題プールの組み立て
      var poolIdx = [];

      if (useSelectedOnly) {
        var selCount = selectedUids.size;
        if (selCount === 0) return { ok:false, reason:'none' };          // 0件は不可
        if (selCount < 10)   return { ok:false, reason:'tooFew', need:10, have:selCount }; // 10未満は不可
        for (var i=0;i<data.length;i++){
          if (selectedUids.has(data[i].uid)) poolIdx.push(i);
        }
      } else {
        if (data.length < 10) return { ok:false, reason:'tooFewAll', need:10, have:data.length };
        for (var j=0;j<data.length;j++) poolIdx.push(j);
      }

      if (poolIdx.length === 0) return { ok:false, reason:'empty' };

      // 出題数をチェック
      var want = parseInt(desiredCount, 10);
      if (!isFinite(want) || want < 10) return { ok:false, reason:'min', need:10 };
      if (want > poolIdx.length) return { ok:false, reason:'lack', want:want, have:poolIdx.length };

      // シャッフル → 先頭から必要数だけ採用
      var a = poolIdx.slice();
      for (var k=a.length-1;k>0;k--){
        var m = Math.floor(Math.random()*(k+1));
        var t = a[k]; a[k] = a[m]; a[m] = t;
      }
      order = a.slice(0, want);

      cursor = 0; answeredCount = 0; correct = 0; wrong = 0;
      return { ok:true, total: order.length };
    }

    function updateHud(){
      var totalDisplay;
      if (runTotal > 0) {
        // テスト中・終了直後ともに直近の出題数を分母に

        // 未開始時はスコープに応じた見込み分母
        totalDisplay = useSelectedOnly ? selectedUids.size : data.length;

      score.textContent = '正解: ' + correct + ' / 不正解: ' + wrong;

    // JSONをlocalStorageに保存/読込

    }
    function loadJSON(key, def) {

        var raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : def;
      } catch(e){ console.error(e); return def; }
    }

    // 進捗とUIの保存キー
    var LS_PROGRESS_KEY = 'vocab_progress_v1'; // { [wordLower]: {attempts, corrects} }
    var LS_UI_KEY = 'vocab_ui_v1';             // { selectedWords, useSelectedOnly, sortValue, questionCount }

    /* ====== 音声 ====== */
    function loadVoices(){ voices=(window.speechSynthesis&&window.speechSynthesis.getVoices)?window.speechSynthesis.getVoices():[]; voiceSelect.innerHTML=''; for(var i=0;i<voices.length;i++){ var opt=document.createElement('option'); opt.value=String(i); opt.textContent=voices[i].name+' ('+voices[i].lang+')'; voiceSelect.appendChild(opt);} if(voices.length>0) voiceSelect.value='0'; }
    loadVoices(); if(window.speechSynthesis) window.speechSynthesis.onvoiceschanged=loadVoices;

    function speak(text){ if(!window.speechSynthesis) return; window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text); var idx=parseInt(voiceSelect.value,10); if(voices[idx]) u.voice=voices[idx]; u.rate=parseFloat(rateInput.value||'1'); u.lang=(u.voice&&u.voice.lang)||'en-US'; window.speechSynthesis.speak(u); }
    function playAudioFor(item){ if(item.audioUrl){ audioEl.src=item.audioUrl; audioEl.play().catch(function(){ speak(item.word); }); return; } speak(item.word); }

    /* ====== 3択 ====== */
    function pickNRandom(arr,n){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a.slice(0,n); }
    function buildChoices(correctIdx){
      var it=data[correctIdx]; var opts=[], wrongs=[];
      if(it.wrongChoices && it.wrongChoices.length>=2){ wrongs=pickNRandom(it.wrongChoices,2); }
      else {
        if(it.wrong1) wrongs.push(it.wrong1);
        if(it.wrong2) wrongs.push(it.wrong2);
        var pool=[]; for(var i=0;i<data.length;i++){ if(i!==correctIdx && data[i].meaning) pool.push(data[i].meaning); }
        while(wrongs.length<2 && pool.length){ var r=Math.floor(Math.random()*pool.length); wrongs.push(pool.splice(r,1)[0]); }
      }
      while(wrongs.length<2) wrongs.push('—');
      opts.push({text:(it.meaning||'(意味未設定)'), correct:true});
      opts.push({text:wrongs[0], correct:false});
      opts.push({text:wrongs[1], correct:false});
      for(var s=opts.length-1;s>0;s--){ var m=Math.floor(Math.random()*(s+1)), tmp=opts[s]; opts[s]=opts[m]; opts[m]=tmp; }
      return opts;
    }
    function renderChoices(opts, item){
      choicesWrap.innerHTML='';
      for(var i=0;i<opts.length;i++){
        (function(o){
          var btn=document.createElement('button'); btn.className='choiceBtn'; btn.textContent=o.text;
          btn.onclick=function(){ handleAnswer(o.correct, item); };
          choicesWrap.appendChild(btn);
        })(opts[i]);
      }
    }

    /* ====== 表示 ====== */
    function showQuestion(){
      if(!data.length){ alert('先にCSVを読み込んでください'); return; }
      if(!started) return; // ★ テスト未開始なら何もしない

      if(cursor>=order.length){
        qWord.textContent='お疲れさまでした！'; qWord.style.display='block';

        showChoicesBtn.classList.add('hidden');
        nextBtn.disabled=true;

        updateHud();
        return;
      }

      var idx=order[cursor], item=data[idx];

      // 共通の初期化
      qWord.textContent=''; qWord.style.display='none';
      qMeaning.style.display='none';
      feedback.style.display='none'; nextBtn.disabled=true;

      // モード分岐
      if (modeSelect && modeSelect.value === 'spelling') {

        if (spellInput) { spellInput.value=''; setTimeout(function(){ spellInput.focus(); }, 0); }
      } else {
        // 3択モード（従来）
        renderChoices(buildChoices(idx), item);

        showChoicesBtn.classList.remove('hidden');

      playAudioFor(item);
      updateHud();
    } // ←★★ ここで showQuestion を閉じる

    // ここから下は関数の外に出す（独立させる）
    function handleAnswer(isCorrect, item){
      if(feedback.style.display==='block') return; // 二重クリック防止

      // 学習履歴（出題回数・正答）を加算
      var idx = order[cursor];
      if (data[idx]) {
        if (typeof data[idx].attempts !== 'number') data[idx].attempts = 0;
        if (typeof data[idx].corrects !== 'number') data[idx].corrects = 0;
        data[idx].attempts += 1;
        if (isCorrect) data[idx].corrects += 1;
      }

      answeredCount++;
      feedback.style.display='block';
      if(isCorrect){ correct++; feedback.className='feedback ok'; feedback.textContent='正解! - '+item.word; }
      else { wrong++; feedback.className='feedback ng'; feedback.textContent='不正解: 正解は '+item.word; }
      nextBtn.disabled=false;
      updateHud();
      if (!wordList.classList.contains('hidden')) renderList();

      // ---- 進捗をローカル保存 ----
      (function(){
        var map = loadJSON(LS_PROGRESS_KEY, {});
        var w = String(item.word||'').toLowerCase();
        var rec = map[w] || {attempts:0, corrects:0};
        var idx = order[cursor];
        if (data[idx]) {
          rec.attempts = data[idx].attempts|0;
          rec.corrects = data[idx].corrects|0;
          map[w] = rec;
          saveJSON(LS_PROGRESS_KEY, map);
        }
      })();
    }


    function normalizeWord(s){
      // 前後空白・全角/半角・大文字小文字の違いを緩和（必要なら拡張可）
      return String(s||'').trim().toLowerCase();
    }
    function handleSpellSubmit(){
      if (!started) return;
      if (!spellInput) return;
      // 二重送信防止（既にフィードバック表示中なら無視）
      if (feedback.style.display === 'block') return;

      var idx = order[cursor];
      var item = data[idx];
      var user = normalizeWord(spellInput.value);
      var ans  = normalizeWord(item.word);

      var isCorrect = (user === ans);
      handleAnswer(isCorrect, item);
    }

    /* ====== 単語リスト ====== */
    function escapeHtml(s){
      s=String(s); var out='', i, c;
      for(i=0;i<s.length;i++){
        c=s.charAt(i);
        if(c==='&') out+='&amp;';
        else if(c==='<' ) out+='&lt;';
        else if(c==='>') out+='&gt;';
        else if(c==='"') out+='&quot;';
        else if(c==="'" ) out+='&#39;';
        else out+=c;
      }
      return out;
    }
    function renderList(){
      if(!data.length){ wordList.innerHTML=''; return; }

      var sortValue = (window.sortSelect && sortSelect.value) ? sortSelect.value : 'word';
      var rows = data.slice();

      function accOf(it){
        var a = (typeof it.attempts==='number') ? it.attempts : 0;
        var c = (typeof it.corrects==='number') ? it.corrects : 0;
        return a > 0 ? Math.round((c/a)*1000)/10 : 0;
      }

      // 並べ替え
      if (sortValue === 'word'){
        rows.sort(function(a,b){ return String(a.word||'').localeCompare(String(b.word||'')); });
      } else if (sortValue === 'accuracyDesc'){
        rows.sort(function(a,b){ return accOf(b) - accOf(a); });
      } else if (sortValue === 'accuracyAsc'){
        rows.sort(function(a,b){ return accOf(a) - accOf(b); });
      } else if (sortValue === 'attemptsDesc'){
        rows.sort(function(a,b){ return (b.attempts||0) - (a.attempts||0); });
      } else if (sortValue === 'attemptsAsc'){
        rows.sort(function(a,b){ return (a.attempts||0) - (b.attempts||0); });
      }

      // 親チェック（ヘッダ）のHTMLを追加（✓列）
      var html = ''
        + '<table><thead><tr>'
        + '<th style="width:6%"><input type="checkbox" id="masterSel"></th>'
        + '<th style="width:28%">英単語</th>'
        + '<th style="width:40%">意味</th>'
        + '<th style="width:14%">正答率(%)</th>'
        + '<th style="width:12%">出題回数</th>'
        + '</tr></thead><tbody>';

      for (var i=0; i<rows.length; i++){
        var it = rows[i] || {};
        var attempts = (typeof it.attempts==='number') ? it.attempts : 0;
        var acc = accOf(it);
        var checked = selectedUids.has(it.uid) ? ' checked' : '';
        html += '<tr>'
          + '<td><input type="checkbox" class="rowSel" data-uid="'+it.uid+'"'+checked+'></td>'
          + '<td>' + escapeHtml(it.word||'') + '</td>'
          + '<td>' + escapeHtml(it.meaning||'') + '</td>'
          + '<td>' + acc + '</td>'
          + '<td>' + attempts + '</td>'
          + '</tr>';
      }
      html += '</tbody></table>';
      wordList.innerHTML = html;

      // 子チェックのイベント
      var boxes = wordList.querySelectorAll('input.rowSel');
      boxes.forEach(function(b){
        b.addEventListener('change', function(e){
          var uid = parseInt(e.target.getAttribute('data-uid'), 10);
          if (e.target.checked) selectedUids.add(uid);
          else selectedUids.delete(uid);
          updateSelCount();
          updateHud();
          updateMasterFromRows(); // ← 親チェック三状態更新
        });
      });

      // 親チェックのイベント
      var master = document.getElementById('masterSel');
      master.addEventListener('change', function(e){
        var checkAll = master.checked; // indeterminate は false 扱い
        // 可視行（rows）に対して一括ON/OFF
        for (var i=0; i<rows.length; i++){
          var uid = rows[i].uid;
          if (checkAll) selectedUids.add(uid);
          else selectedUids.delete(uid);
        }
        // 表示のチェックも更新
        boxes.forEach(function(b){
          var uid = parseInt(b.getAttribute('data-uid'),10);
          b.checked = selectedUids.has(uid);
        });
        updateSelCount();
        updateHud();
        updateMasterFromRows(); // 再計算（全選択/全解除で indeterminate をクリア）
      });

      // 親チェックの三状態を rows から算出
      function updateMasterFromRows(){
        var total = rows.length;
        var sel = 0;
        for (var i=0;i<rows.length;i++){
          if (selectedUids.has(rows[i].uid)) sel++;
        }
        master.indeterminate = (sel>0 && sel<total);
        master.checked = (sel===total && total>0);
      }

      updateMasterFromRows();
    }

    function updateSelCount(){
      if (selCount) selCount.textContent = '選択:' + selectedUids.size;
    }
    /* ====== エクスポート ====== */
    function toCsvValue(s){
      s = String(s==null?'':s);
      var needQuote = s.indexOf(',')>=0 || s.indexOf('"')>=0 || s.indexOf('\n')>=0 || s.indexOf('\r')>=0 || s.indexOf(';')>=0;
      if (s.indexOf('"')>=0) s = s.split('"').join('""');
      return needQuote ? '"' + s + '"' : s;
    }
    function buildExportCsv(){
      var lines = [];
      // ヘッダ
      lines.push('word,meaning,wrong_choices,audioUrl,attempts,accuracy');
      for (var i=0;i<data.length;i++){
        var it = data[i] || {};
        var wc = it.wrongChoices && it.wrongChoices.length ? it.wrongChoices.join(';') : ((it.wrong1||'') + (it.wrong2?';'+it.wrong2:''));
        var attempts = typeof it.attempts==='number' ? it.attempts : 0;
        var corrects = typeof it.corrects==='number' ? it.corrects : 0;
        var accuracy = attempts>0 ? Math.round((corrects/attempts)*1000)/10 : 0; // 小数1桁
        var row = [
          toCsvValue(it.word||''),
          toCsvValue(it.meaning||''),
          toCsvValue(wc||''),
          toCsvValue(it.audioUrl||''),
          toCsvValue(attempts),
          toCsvValue(accuracy) // 例: 66.7
        ].join(',');
        lines.push(row);
      }
      return lines.join('\r\n');
    }
    function downloadText(filename, text){
      // BOMを付与
      var bom = "\ufeff";
      var blob = new Blob([bom + text], {type:'text/csv;charset=utf-8;'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
    }
    exportBtn.addEventListener('click', function(){
      if(!data.length){ alert('先にCSVを読み込んでください'); return; }
      var now = new Date();
      function pad(n){ return (n<10?'0':'')+n; }
      var y = now.getFullYear(), m = pad(now.getMonth()+1), d = pad(now.getDate()), hh = pad(now.getHours()), mm = pad(now.getMinutes());
      var filename = 'vocab_export_' + y + m + d + '_' + hh + mm + '.csv';
      var csv = buildExportCsv();
      downloadText(filename, csv);
    });

    /* ====== ヘルパーを追加 ====== */
    function isTypingContext() {
      var el = document.activeElement;
      if (!el) return false;
      var tag = (el.tagName || '').toLowerCase();
      return tag === 'input' || tag === 'textarea' || tag === 'select' || el.isContentEditable;
    }
    function getChoiceButtons(){
      return choicesWrap.querySelectorAll('.choiceBtn');
    }
    function revealChoicesIfHidden(){
      if (started && choicesWrap.classList.contains('hidden')) {
        showChoicesBtn.click();
        return true; // いま表示した
      }
      return false;
    }

    // 入力正規化（前後空白・大文字小文字を無視）
    function norm(s){
      return String(s||'').trim().toLowerCase();
    }

    // スペル入力の採点 → 既存の handleAnswer を呼ぶ
    function handleSpellSubmit(){
      if (!started) return;
      var idx = order[cursor];
      var item = data[idx];
      if (!item) return;

      var user = norm(spellInput && spellInput.value);
      var ans  = norm(item.word);

      // 必要なら、ハイフン/スペース無視したい場合は次の行を有効化：
      // user = user.replace(/[\s\-]/g,''); ans = ans.replace(/[\s\-]/g,'');

    /* ====== イベント ====== */
    showChoicesBtn.addEventListener('click', function(){if(!started) return; choicesWrap.classList.remove('hidden'); showChoicesBtn.classList.add('hidden'); });
    replayBtn.addEventListener('click', function(){if(!started) return; var idx=order[cursor]||0; var it=data[idx]; playAudioFor(it); });
    nextBtn.addEventListener('click', function(){if(!started) return; cursor++; showQuestion(); });

    // （任意・より確実）スペル入力欄で Enter なら回答
    spellInput.addEventListener('keydown', function(e){
      if (!started) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        // まだ採点前（=「次へ」が無効）なら採点、採点後なら次へ

          handleSpellSubmit();
        } else {
          nextBtn.click();
        }
      }
    });

    document.addEventListener('keydown', function(e){
      // 入力中なら無視
      if (isTypingContext()) return;

      var key = e.key;            // 表示用のキー
      var code = e.code;          // 物理キー（Numpad対応）
      if (!key) return;

      // 共通ガード
      function pressNextIfEnabled(){
        if (started && !nextBtn.disabled) { e.preventDefault(); nextBtn.click(); }
      }
      function pressDontKnow(){
        if (started) { e.preventDefault(); dontKnowBtn.click(); }
      }
      function pressReplay(){
        if (started) { e.preventDefault(); replayBtn.click(); }
      }
      function pressShowChoices(){
        if (started && choicesWrap.classList.contains('hidden')) { e.preventDefault(); showChoicesBtn.click(); }
      }
      function pressChoiceIndex(i){
        if (!started) return;
        if (revealChoicesIfHidden()) { // いま表示したばかりなら、一旦表示だけして終了
          e.preventDefault();
          return;
        }
        var btns = getChoiceButtons();
        if (btns && btns[i]) { e.preventDefault(); btns[i].click(); }
      }

      // 正規化
      var lower = key.toLowerCase();

      // マッピング
      if (lower === ' '){                // Space
        pressReplay(); return;
      }
      if (lower === 'r'){                // R
        pressReplay(); return;
      }
      if (lower === 's'){                // S
        pressShowChoices(); return;
      }
      if (lower === 'd'){                // D
        pressDontKnow(); return;
      }

      // スペル入力モードでは Enter で回答、→ は次へ（従来通り）
      if (modeSelect && modeSelect.value === 'spelling'){
        if (e.key === 'Enter'){
          if (started && nextBtn.disabled){ // まだ回答していない状態
            e.preventDefault(); handleSpellSubmit(); return;
          }
        }
        // 数字キー/選択肢表示は無視
      }

      if (lower === 'enter' || key === 'Enter' || code === 'ArrowRight'){ // Enter / →
        pressNextIfEnabled(); return;
      }

      // 数字キー（上段・テンキー両対応）
      if (lower === '1' || code === 'Numpad1'){ pressChoiceIndex(0); return; }
      if (lower === '2' || code === 'Numpad2'){ pressChoiceIndex(1); return; }
      if (lower === '3' || code === 'Numpad3'){ pressChoiceIndex(2); return; }
    });

    startBtn.addEventListener('click', function(){ if(!data.length){ alert('CSVを読み込んでください'); return; }
      var desired = parseInt(questionCount.value, 10);

    });

    modeSelect.addEventListener('change', function(){
      // テスト中は見た目だけ切替（次の問題から完全反映）
      if (started){
        if (modeSelect.value === 'spelling'){
          // 選択肢隠す・入力出す
          showChoicesBtn.classList.add('hidden');
          choicesWrap.classList.add('hidden');
          spellingWrap.classList.remove('hidden');
          setTimeout(function(){ if (spellInput) spellInput.focus(); }, 0);
        } else {
          // 入力隠す・選択肢UIへ
          spellingWrap.classList.add('hidden');
          showChoicesBtn.classList.remove('hidden');
          // 次の問題で選択肢を再構成
        }
      }
    });

    renderList(); wordList.classList.remove('hidden'); showListBtn.textContent='単語リスト非表示';
      // ▼ 並べ替えUIを表示＆有効化
    sortWrap.style.display = 'inline-flex';
    sortSelect.disabled = false;
    quizScopeWrap.style.display = 'inline-flex';
    quizScope.disabled = false;
    clearSelectionBtn.disabled = false;
    updateSelCount();  // 選択数の表示
    });
    quizScope.addEventListener('change', function(){
      useSelectedOnly = (quizScope.value === 'selected');
      runTotal = 0; updateHud();

    // ---- UI保存 ----
    (function(){
      var ui = loadJSON(LS_UI_KEY, {});
      ui.useSelectedOnly = useSelectedOnly;
      ui.sortValue = (sortSelect && sortSelect.value) || 'word';
      ui.questionCount = (questionCount && questionCount.value)|0;
      ui.selectedWords = Array.from(selectedUids, function(uid){
        var it = data.find(function(x){return x.uid===uid;});
        return it ? String(it.word||'') : null;
      }).filter(Boolean);
      saveJSON(LS_UI_KEY, ui);
    })();
      updateHud();
    });

  /*
    // ---- UI保存（選択語・スコープ・並べ替え・出題数）----
    (function(){
      var arr = [];
      selectedUids.forEach(function(uid){
        var it = data.find(function(x){return x.uid===uid;});

      });
      var ui = loadJSON(LS_UI_KEY, {});
      ui.selectedWords = arr;
      ui.useSelectedOnly = useSelectedOnly;
      ui.sortValue = (sortSelect && sortSelect.value) || 'word';
      ui.questionCount = (questionCount && questionCount.value)|0;
      saveJSON(LS_UI_KEY, ui);
    })();
  */

    clearSelectionBtn.addEventListener('click', function(){
      selectedUids.clear();

      // ---- UI保存 ----
      (function(){
        var ui = loadJSON(LS_UI_KEY, {});
        ui.selectedWords = [];
        ui.useSelectedOnly = useSelectedOnly;
        ui.sortValue = (sortSelect && sortSelect.value) || 'word';
        ui.questionCount = (questionCount && questionCount.value)|0;
        saveJSON(LS_UI_KEY, ui);
      })();

      updateSelCount();
      if (!wordList.classList.contains('hidden')) renderList();
        runTotal = 0; updateHud();
      updateHud();
    });

    weakSelectBtn.addEventListener('click', function(){
      if(!data.length){ alert('CSVを読み込んでください'); return; }
      var thAcc = parseFloat(String(weakAcc.value).replace(',', '.'));
      if(!isFinite(thAcc)) thAcc = 60;
      var minAtt = parseInt(weakMinAtt.value, 10); if(!isFinite(minAtt)) minAtt = 3;

      var added = 0;
      for (var i=0;i<data.length;i++){
        var it = data[i];
        var a = it.attempts|0, c = it.corrects|0;
        var acc = a>0 ? (c/a*100) : 100; // 未学習は対象外（必要なら0扱いに変更可）
        if (a>=minAtt && acc < thAcc){
          if (!selectedUids.has(it.uid)){ selectedUids.add(it.uid); added++; }
        }
      }
      if (!wordList.classList.contains('hidden')) renderList();
      updateSelCount(); updateHud();

      // 選択語を保存
      (function(){
        var arr = [];
        selectedUids.forEach(function(uid){
          var it = data.find(function(x){return x.uid===uid;});
          if(it) arr.push(String(it.word||''));
        });
        var ui = loadJSON(LS_UI_KEY, {});
        ui.selectedWords = arr;
        saveJSON(LS_UI_KEY, ui);
      })();

      alert('弱点を一括選択しました：' + added + ' 語');
    });
  
    document.getElementById('resetDataBtn').addEventListener('click', () => {
      if (confirm('学習履歴をリセットしますか？（元に戻せません）')) {
        try {
          // 学習履歴とUI状態を両方クリア
          localStorage.removeItem(LS_PROGRESS_KEY); // 例: 'vocab_progress_v1'
          localStorage.removeItem(LS_UI_KEY);       // 例: 'vocab_ui_v1'
        } catch (e) {
          console.warn('localStorage clear error:', e);
        }
        alert('学習履歴をリセットしました。\n次回CSVを読み込むと新規状態から始まります。');
        location.reload(); // リロードで画面状態も初期化
      }
    });

    updateHud();
  </script>
